<!DOCTYPE html>
<html lang="zh-CN">
<head>

<title>休食组友好商家违规监控</title>

</head>
<body>
<div class="topbar">
  <div class="brand">
    <span class="emoji">🛡️</span>
    <div>
      <h1>休食组友好商家违规监控</h1>
      <div class="subtitle" id="subtitle">加载中…</div>

  </div>
  <div class="tabs">

    <div class="tab" data-tab="am">AM 视角</div>

<main>
  <div class="filters" id="filters" style="display:none">

      <select id="f-am"><option value="">全部</option></select>
    </label>
    <label>档位
      <select id="f-tier">
        <option value="">全部</option>

        <option value="safe">⚪ 安全</option>

    <label>搜索商家
      <input id="f-kw" type="text" placeholder="店铺名关键词">
    </label>
    <span class="filter-hint" id="filter-hint"></span>
  </div>
  <div id="app"><div class="loading">加载中…</div></div>

<script src="assets/app.js?v=f89492ee"></script>
